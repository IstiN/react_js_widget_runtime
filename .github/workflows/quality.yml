name: Quality
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash scripts/fetch-conformance.sh
      - run: bash scripts/sync-bootstrap.sh && git diff --exit-code
      - run: npm test
      - run: npm run coverage
      - name: Coverage file is present and non-empty
        run: test -s coverage/coverage-final.json
      - run: npm run crap
